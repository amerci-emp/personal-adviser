[build]
  command = "npm run build:netlify"
  publish = ".next"

[functions]
  node_bundler = "esbuild"
  included_files = ["node_modules/.prisma/**", "prisma/**"]

[build.environment]
  NODE_VERSION = "18"

# Add build hooks for Prisma
[[plugins]]
  package = "@netlify/plugin-prisma"

# Handle Next.js routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Handle API routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
